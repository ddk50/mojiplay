version: 2
updates:
  # npm 依存 (package.json / package-lock.json)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # minor / patch のみをまとめて 1 PR に (常に green・PR 乱立も無し)。
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # major は自動 PR を出さない。破壊的変更は手動で対応する。
      #   - typescript 7: ts-jest が peer typescript "<7" のため install 不可 (追従待ち)
      #   - fabric 7: アプリが v5 内部 API に依存 + @types/fabric が v5 系のみ
      #   - electron / @types/node 等のメジャーも意図的に手動更新
      # 更新したくなったら該当行を一時的に外して recreate する。
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions 自体 (actions/checkout, actions/setup-node 等) の更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions-all:
        patterns:
          - '*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
