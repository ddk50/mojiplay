version: 2
updates:
  # npm 依存 (package.json / package-lock.json)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # major も含めて全 npm 依存を 1 PR にまとめる (PR 乱立を防ぐ)。
      # 個人用途なので major も一括レビューで十分。
      npm-all:
        patterns:
          - '*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'

  # GitHub Actions 自体 (actions/checkout, actions/setup-node 等) の更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions-all:
        patterns:
          - '*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
