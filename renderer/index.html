<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Layout Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu-bar">
    <div class="menu-item" data-menu="edit">
      <span class="menu-label">Edit</span>
      <div class="menu-dropdown">
        <button data-action="undo">元に戻す<span class="shortcut">Ctrl+Z</span></button>
        <button data-action="redo">やり直し<span class="shortcut">Ctrl+Shift+Z</span></button>
        <div class="menu-separator"></div>
        <button data-action="copy">コピー (PNG)<span class="shortcut">Ctrl+C</span></button>
        <button data-action="paste">貼り付け<span class="shortcut">Ctrl+V</span></button>
        <button data-action="delete">削除<span class="shortcut">Delete</span></button>
        <div class="menu-separator"></div>
        <button data-action="select-all">すべて選択<span class="shortcut">Ctrl+A</span></button>
      </div>
    </div>
    <div class="menu-item" data-menu="view">
      <span class="menu-label">View</span>
      <div class="menu-dropdown">
        <button data-action="devtools">開発者ツール<span class="shortcut">F12</span></button>
        <div class="menu-separator"></div>
        <button data-action="zoom-in">拡大<span class="shortcut">Ctrl+=</span></button>
        <button data-action="zoom-out">縮小<span class="shortcut">Ctrl+-</span></button>
        <button data-action="zoom-reset">リセット<span class="shortcut">Ctrl+0</span></button>
        <div class="menu-separator"></div>
        <button data-action="fullscreen">全画面表示<span class="shortcut">F11</span></button>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <div class="toolbar-group">
      <button id="btn-mode-select-group" class="mode-btn is-active" title="グループ選択/移動 (黒矢印)">
        <svg class="tool-icon" viewBox="0 0 14 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M2,1 L2,14 L5,11 L7.5,16.5 L9.5,15.5 L7,10 L12,10 Z"/>
        </svg>
      </button>
      <button id="btn-mode-select-char" class="mode-btn" title="文字選択/カーニング (白矢印)">
        <svg class="tool-icon outline-arrow" viewBox="0 0 14 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M2,1 L2,14 L5,11 L7.5,16.5 L9.5,15.5 L7,10 L12,10 Z"/>
        </svg>
      </button>
      <button id="btn-mode-text" class="mode-btn" title="文字入力 (T)" style="font-weight:700;font-size:12px;">T</button>
      <button id="btn-mode-pen-add" class="mode-btn" title="アンカーポイント追加 (+ペン)">
        <svg class="tool-icon pen-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path class="pen-nib" d="M9,1 L13,5.5 L11.5,10.5 L9,16 L6.5,10.5 L5,5.5 Z"/>
          <circle class="pen-dot" cx="9" cy="6.5" r="1.6"/>
          <line class="pen-sign" x1="14.5" y1="12" x2="14.5" y2="17" stroke-width="1.8" stroke-linecap="round"/>
          <line class="pen-sign" x1="12" y1="14.5" x2="17" y2="14.5" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-mode-pen-remove" class="mode-btn" title="アンカーポイント削除 (-ペン)">
        <svg class="tool-icon pen-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path class="pen-nib" d="M9,1 L13,5.5 L11.5,10.5 L9,16 L6.5,10.5 L5,5.5 Z"/>
          <circle class="pen-dot" cx="9" cy="6.5" r="1.6"/>
          <line class="pen-sign" x1="12" y1="14.5" x2="17" y2="14.5" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-group">
      <label for="font-family">フォント</label>
      <select id="font-family">
        <option value="Arial">Arial</option>
      </select>
      <label for="font-style">スタイル</label>
      <select id="font-style">
        <option value="400|normal">Regular</option>
      </select>
    </div>

    <div class="toolbar-group">
      <label for="font-size">サイズ</label>
      <input id="font-size" type="number" value="72" min="8" max="400" step="1" />
    </div>

    <div class="toolbar-group">
      <label for="font-color">カラー</label>
      <input id="font-color" type="color" value="#000000" />
    </div>

    <div class="toolbar-group">
      <label for="rotation">回転 (°)</label>
      <input id="rotation" type="number" value="0" min="-360" max="360" step="1" />
      <button id="btn-apply-rotation">適用</button>
    </div>

    <div class="toolbar-group" title="白矢印モードでの移動時、グリッドに吸着します (Alt で一時バイパス)">
      <label for="snap-enabled">スナップ</label>
      <input id="snap-enabled" type="checkbox" checked />
      <label for="snap-pitch">グリッド</label>
      <input id="snap-pitch" type="number" value="8" min="1" max="64" step="1" />
      <label for="snap-threshold">閾値</label>
      <input id="snap-threshold" type="number" value="5" min="1" max="32" step="1" />
    </div>

    <div class="toolbar-group">
      <button id="btn-select-all">全選択</button>
      <button id="btn-clear">クリア</button>
    </div>

    <div class="toolbar-group">
      <button id="btn-outline" title="選択中の文字をパス化 (Cmd/Ctrl+Shift+O)">アウトライン化</button>
    </div>

    <div class="toolbar-group">
      <button id="btn-export" class="btn-primary">PNG書き出し</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
  </div>

  <script src="vendor/fabric.min.js"></script>
  <script src="vendor/fontkit.js"></script>
  <script src="../dist/core/path/types.js"></script>
  <script src="../dist/core/path/anchors.js"></script>
  <script src="../dist/core/path/fabric-adapter.js"></script>
  <script src="../dist/core/outline-position.js"></script>
  <script src="../dist/core/copy-export.js"></script>
  <script src="../dist/renderer/logger.js"></script>
  <script src="../dist/renderer/toast.js"></script>
  <script src="../dist/renderer/font-enumeration.js"></script>
  <script src="../dist/renderer/outline-conversion.js"></script>
  <script src="../dist/renderer/menu-bar.js"></script>
  <script src="../dist/renderer/app.js"></script>
</body>
</html>
